# Variables útiles en despliegue (Render, Railway, Fly.io, etc.):
#   PORT              — Puerto HTTP (Render lo define automáticamente).
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD — PostgreSQL.
#   DB_SSL_MODE       — require (por defecto, típico en nube) | disable (Docker/local sin SSL).
#   CORS_ALLOWED_ORIGINS — Orígenes del front, coma-separados (ej. https://tu-app.vercel.app,http://localhost:4200).

server:
  port: ${PORT:8080}
  address: 0.0.0.0

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring:
  application:
    name: ms-ecommerce

  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSL_MODE:require}"
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  # # # # # Configuración ORM # # # # #
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Configuración de Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
