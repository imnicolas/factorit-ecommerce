<div class="autocomplete-wrapper">
  <input class="input autocomplete-input"
         type="text"
         [placeholder]="placeholder"
         [ngModel]="searchTerm"
         (ngModelChange)="onChange($event)"
         (focus)="onFocus()"
         (blur)="onBlur()"
         autocomplete="off">
  <button *ngIf="showClear && selected"
          class="clear-btn"
          type="button"
          (click)="clear()"
          title="Limpiar">×</button>

  <div class="autocomplete-dropdown" *ngIf="showDropdown">
    <div class="dropdown-loading" *ngIf="loading">Buscando...</div>
    <ng-container *ngIf="!loading">
      <div class="dropdown-empty" *ngIf="clientes.length === 0">Sin resultados</div>
      <button type="button"
              class="dropdown-item"
              *ngFor="let c of clientes"
              (mousedown)="onSelect(c)">
        <div class="dropdown-item-main">
          <span class="client-name">{{ c.nombre }} {{ c.apellido }}</span>
          <span class="vip-pill" *ngIf="c.esVip">VIP</span>
        </div>
        <span class="client-dni">DNI: {{ c.dni }}</span>
      </button>
    </ng-container>
  </div>
</div>
