<div class="dialog-backdrop" *ngIf="state" (click)="onBackdropClick()">
  <div class="dialog" [ngClass]="'dialog-' + state.type" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <span class="dialog-icon" [ngClass]="'icon-' + state.type">
        <ng-container [ngSwitch]="state.type">
          <svg *ngSwitchCase="'success'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <svg *ngSwitchCase="'error'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          <svg *ngSwitchCase="'confirm'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <svg *ngSwitchDefault width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        </ng-container>
      </span>
      <h3 class="dialog-title">{{ state.title }}</h3>
    </div>

    <div class="dialog-body">
      <p>{{ state.message }}</p>
    </div>

    <div class="dialog-footer">
      <button *ngIf="state.cancelLabel"
              class="btn btn-secondary"
              (click)="cancel()">
        {{ state.cancelLabel }}
      </button>
      <button class="btn"
              [class.btn-primary]="!state.danger"
              [class.btn-danger]="state.danger"
              (click)="confirm()">
        {{ state.confirmLabel }}
      </button>
    </div>
  </div>
</div>
